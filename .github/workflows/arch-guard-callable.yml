name: arch-guard (reusable)

# Called by pipeline repos via:
#   uses: gs-dbx/arch-guard/.github/workflows/arch-guard-callable.yml@main
on:
  workflow_call:
    inputs:
      contract:
        description: Path to arch-contract.yaml in the calling repo
        type: string
        default: arch-contract.yaml
      advisory:
        description: >
          Advisory mode (true = always exit 0, v1 default).
          Set to false in v3 when enforcement is enabled.
        type: boolean
        default: true
      arch_guard_ref:
        description: Branch/tag of the arch-guard repo to use (pin to a release in prod)
        type: string
        default: main
      runner:
        description: >
          Runner label or group for this job.
          Default is GitHub-hosted ubuntu-latest.
          Override with your org's protected runner label for FM review to work
          through workspace IP ACLs (e.g. "self-hosted" or a runner group name).
        type: string
        default: ubuntu-latest
      databricks_auth_type:
        description: >
          Databricks auth method. Options:
            github-oidc        — GitHub OIDC WIF, no stored secrets (recommended)
            client-credentials — M2M OAuth, needs CLIENT_ID + CLIENT_SECRET secrets
          Leave blank to skip FM review and UC grounding.
        type: string
        default: github-oidc
    secrets:
      DATABRICKS_HOST:
        required: false
      DATABRICKS_CLIENT_ID:
        required: false
      DATABRICKS_CLIENT_SECRET:
        required: false        # only needed for client-credentials auth type
      FM_SERVING_ENDPOINT:
        required: false
      ARCH_GUARD_TOKEN:
        required: false        # only needed if arch-guard repo is in a different org

permissions:
  contents: read
  pull-requests: write        # post PR review comments
  security-events: write      # upload SARIF → inline annotations
  checks: write               # neutral check (flip to required in v3)
  id-token: write             # GitHub OIDC — required for github-oidc auth type

jobs:
  arch-guard:
    runs-on: ${{ inputs.runner }}

    steps:
      # 1. Check out the calling pipeline repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Check out the arch-guard engine
      - uses: actions/checkout@v4
        with:
          repository: gs-dbx/arch-guard
          ref: ${{ inputs.arch_guard_ref }}
          path: .arch-guard
          token: ${{ secrets.ARCH_GUARD_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .arch-guard/requirements.txt

      - name: Install arch-guard
        run: pip install -r .arch-guard/requirements.txt

      - name: Show runner egress IP
        run: |
          egress=$(curl -fsS --max-time 5 https://ifconfig.me 2>/dev/null || echo "unknown")
          echo "arch-guard: runner egress IP: $egress"
          echo "arch-guard: if FM review is blocked, add $egress/32 to the workspace IP ACL."

      - name: Run arch-guard
        id: arch_guard
        env:
          # Databricks auth — SDK reads these automatically.
          # github-oidc:        only DATABRICKS_HOST + DATABRICKS_CLIENT_ID needed.
          # client-credentials: also needs DATABRICKS_CLIENT_SECRET.
          DATABRICKS_AUTH_TYPE: ${{ inputs.databricks_auth_type }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          FM_ENDPOINT: ${{ secrets.FM_SERVING_ENDPOINT }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "No PR SHA context — falling back to git log"
            HEAD_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "Checking diff: $BASE_SHA..$HEAD_SHA"

          ADVISORY_FLAG=""
          if [ "${{ inputs.advisory }}" = "true" ]; then
            ADVISORY_FLAG="--advisory"
          fi
          PYTHONPATH=.arch-guard python -m arch_guard.check \
            --contract "${{ inputs.contract }}" \
            --diff-base "$BASE_SHA" \
            --diff-head "$HEAD_SHA" \
            --sarif-out findings.sarif \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            $ADVISORY_FLAG

      - name: Upload SARIF (inline PR annotations)
        if: always()
        continue-on-error: true   # requires GitHub Advanced Security on private repos
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: findings.sarif
          category: arch-guard
