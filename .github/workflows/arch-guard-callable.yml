name: arch-guard (reusable)

# Called by pipeline repos via:
#   uses: gs-dbx/arch-guard/.github/workflows/arch-guard-callable.yml@main
on:
  workflow_call:
    inputs:
      contract:
        description: Path to arch-contract.yaml in the calling repo
        type: string
        default: arch-contract.yaml
      advisory:
        description: >
          Advisory mode (true = always exit 0, v1 default).
          Set to false in v3 when enforcement is enabled.
        type: boolean
        default: true
      arch_guard_ref:
        description: Branch/tag of the arch-guard repo to use (pin to a release in prod)
        type: string
        default: main
    secrets:
      DATABRICKS_HOST:
        required: false
      DATABRICKS_CLIENT_ID:
        required: false
      DATABRICKS_CLIENT_SECRET:
        required: false
      FM_SERVING_ENDPOINT:
        required: false
      # Token to check out the arch-guard repo if it is in a different org.
      # Leave unset if both repos are in the same org (GITHUB_TOKEN is used).
      ARCH_GUARD_TOKEN:
        required: false

jobs:
  arch-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # post PR review comments
      security-events: write      # upload SARIF → inline annotations
      checks: write               # neutral check (flip to required in v3)

    steps:
      # 1. Check out the calling pipeline repo (default — GITHUB_REPOSITORY is the caller)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base..head diff

      # 2. Check out the arch-guard engine from the governance repo
      - uses: actions/checkout@v4
        with:
          repository: gs-dbx/arch-guard     # ← update to your org/repo
          ref: ${{ inputs.arch_guard_ref }}
          path: .arch-guard
          token: ${{ secrets.ARCH_GUARD_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .arch-guard/requirements.txt

      - name: Install arch-guard
        run: pip install -r .arch-guard/requirements.txt

      - uses: databricks/setup-cli@main

      - name: Obtain Databricks token
        if: ${{ secrets.DATABRICKS_CLIENT_ID != '' }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          token=$(databricks auth token --host "$DATABRICKS_HOST" 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || echo "")
          if [ -n "$token" ]; then
            echo "DATABRICKS_TOKEN=$token" >> $GITHUB_ENV
            echo "Token obtained via Databricks CLI."
          else
            echo "Warning: could not obtain Databricks token — UC grounding and FM review will be skipped."
          fi

      - name: Run arch-guard
        id: arch_guard
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          FM_ENDPOINT: ${{ secrets.FM_SERVING_ENDPOINT }}
        run: |
          # Resolve SHAs — use PR context when available, fall back to git for
          # workflow_dispatch runs or any case where the PR event isn't propagated.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "No PR SHA context — falling back to git log"
            HEAD_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "Checking diff: $BASE_SHA..$HEAD_SHA"

          ADVISORY_FLAG=""
          if [ "${{ inputs.advisory }}" = "true" ]; then
            ADVISORY_FLAG="--advisory"
          fi
          PYTHONPATH=.arch-guard python -m arch_guard.check \
            --contract "${{ inputs.contract }}" \
            --diff-base "$BASE_SHA" \
            --diff-head "$HEAD_SHA" \
            --sarif-out findings.sarif \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            $ADVISORY_FLAG

      - name: Upload SARIF (inline PR annotations)
        if: always()
        continue-on-error: true   # requires GitHub Advanced Security on private repos
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: findings.sarif
          category: arch-guard
