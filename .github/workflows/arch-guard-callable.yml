name: arch-guard (reusable)

# Called by pipeline repos via:
#   uses: gs-dbx/arch-guard/.github/workflows/arch-guard-callable.yml@main
on:
  workflow_call:
    inputs:
      contract:
        description: Path to arch-contract.yaml in the calling repo
        type: string
        default: arch-contract.yaml
      advisory:
        description: >
          Advisory mode (true = always exit 0, v1 default).
          Set to false in v3 when enforcement is enabled.
        type: boolean
        default: true
      arch_guard_ref:
        description: Branch/tag of the arch-guard repo to use (pin to a release in prod)
        type: string
        default: main

      # Runner label for this job.
      # Use any label visible in your org's runner settings.
      # For a runner group, assign a label to the group and pass that label here.
      runner:
        description: Runner label (e.g. "ubuntu-latest" or "self-hosted")
        type: string
        default: ubuntu-latest

      # GitHub environment name — required for OIDC subject precision.
      # The Databricks SP federated credential must match:
      #   repo:<org>/<repo>:environment:<environment>
      environment:
        description: GitHub environment name (used to scope the OIDC subject claim)
        type: string
        default: ""

      # Non-sensitive Databricks config — pass from vars, not secrets
      databricks_host:
        description: Databricks workspace URL (e.g. https://adb-xxx.azuredatabricks.net)
        type: string
        default: ""
      databricks_client_id:
        description: Service principal application ID
        type: string
        default: ""

      databricks_auth_type:
        description: >
          Databricks auth method:
            github-oidc        — GitHub OIDC WIF, no stored secrets (recommended)
            client-credentials — M2M OAuth, needs DATABRICKS_CLIENT_SECRET secret
        type: string
        default: github-oidc

      fm_endpoint:
        description: >
          FM serving endpoint or AI Gateway model name
          (e.g. system.ai.claude-opus-5 or databricks-meta-llama-3-3-70b-instruct)
        type: string
        default: ""

    secrets:
      DATABRICKS_CLIENT_SECRET:
        required: false        # only needed for client-credentials auth type
      ARCH_GUARD_TOKEN:
        required: false        # only needed if arch-guard repo is in a different org

permissions:
  contents: read
  pull-requests: write        # post PR review comments
  security-events: write      # upload SARIF → inline annotations
  checks: write               # neutral check (flip to required in v3)
  id-token: write             # GitHub OIDC — required for github-oidc auth type

jobs:
  arch-guard:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: gs-dbx/arch-guard
          ref: ${{ inputs.arch_guard_ref }}
          path: .arch-guard
          token: ${{ secrets.ARCH_GUARD_TOKEN || github.token }}

      - name: Set up Python
        run: |
          # Use system Python on self-hosted runners (avoids SSL cert issues with
          # actions/setup-python on machines behind a corporate CA).
          # Falls back to actions/setup-python path if system Python is too old.
          PYVER=$(python3 --version 2>&1 | awk '{print $2}')
          echo "arch-guard: using system Python $PYVER"
          echo "PATH=$(dirname $(which python3)):$PATH" >> $GITHUB_ENV

      - name: Install arch-guard
        run: |
          # Try pip install — falls back gracefully if PyPI is unreachable
          # (self-hosted runners on air-gapped networks may have deps pre-installed)
          pip3 install -r .arch-guard/requirements.txt 2>/dev/null || \
            python3 -c "import yaml, jsonschema; print('arch-guard: using pre-installed deps')" || \
            (echo "arch-guard: required packages not available — install pyyaml jsonschema via your local Nexus mirror" && exit 1)

      - name: Show runner egress IP
        run: |
          egress=$(curl -fsS --max-time 5 https://ifconfig.me 2>/dev/null || echo "unknown")
          echo "arch-guard: runner egress IP: $egress"
          echo "arch-guard: if FM review is blocked, add $egress/32 to the workspace IP ACL."

      - name: Run arch-guard
        id: arch_guard
        env:
          # Set DATABRICKS_AUTH_TYPE only for github-oidc.
          # For M2M (client-credentials), leave it unset — the SDK auto-detects
          # oauth-m2m from the presence of CLIENT_ID + CLIENT_SECRET.
          DATABRICKS_AUTH_TYPE: ${{ inputs.databricks_auth_type == 'github-oidc' && 'github-oidc' || '' }}
          DATABRICKS_HOST: ${{ inputs.databricks_host }}
          DATABRICKS_CLIENT_ID: ${{ inputs.databricks_client_id }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          FM_ENDPOINT: ${{ inputs.fm_endpoint }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "No PR SHA context — falling back to git log"
            HEAD_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "Checking diff: $BASE_SHA..$HEAD_SHA"

          ADVISORY_FLAG=""
          if [ "${{ inputs.advisory }}" = "true" ]; then
            ADVISORY_FLAG="--advisory"
          fi
          PYTHONPATH=.arch-guard python -m arch_guard.check \
            --contract "${{ inputs.contract }}" \
            --diff-base "$BASE_SHA" \
            --diff-head "$HEAD_SHA" \
            --sarif-out findings.sarif \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            $ADVISORY_FLAG

      - name: Upload SARIF (inline PR annotations)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: findings.sarif
          category: arch-guard
